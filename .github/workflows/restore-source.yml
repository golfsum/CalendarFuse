name: Restore CalendarFuse direct source

on:
  push:
    branches:
      - main
    paths:
      - "payload/source.part.12"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendarfuse-source-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract source
        id: restore
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f payload/source.part.12 ]]; then
            echo "CalendarFuse is already materialized as direct source."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_b64_sha="6c4b7ea5117e8010d7240cf0fd8820ab287545af22eff5be0e57cf7118c37473"
          expected_tar_sha="a294f959cb7ca46d51811e6df0ed170fdb0cdc58726b5e1ab794bd019d33520c"

          payload_files=()
          for index in $(seq -w 0 12); do
            file="payload/source.part.${index}"
            test -s "$file"
            payload_files+=("$file")
          done

          cat "${payload_files[@]}" | tr -d '\r\n\t ' > /tmp/calendarfuse-source.tar.gz.b64

          actual_b64_sha="$(sha256sum /tmp/calendarfuse-source.tar.gz.b64 | awk '{print $1}')"
          test "$actual_b64_sha" = "$expected_b64_sha"

          base64 --decode /tmp/calendarfuse-source.tar.gz.b64 > /tmp/calendarfuse-source.tar.gz
          actual_tar_sha="$(sha256sum /tmp/calendarfuse-source.tar.gz | awk '{print $1}')"
          test "$actual_tar_sha" = "$expected_tar_sha"
          tar -tzf /tmp/calendarfuse-source.tar.gz >/dev/null

          rm -rf /tmp/calendarfuse-site
          mkdir -p /tmp/calendarfuse-site
          tar -xzf /tmp/calendarfuse-source.tar.gz -C /tmp/calendarfuse-site

          for file in index.html app.html privacy.html terms.html support.html styles.css app.css site.js app.js vercel.json; do
            test -s "/tmp/calendarfuse-site/$file"
          done

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/calendarfuse-site/. .
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit ordinary source files
        if: steps.restore.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "calendarfuse-builder"
          git config user.email "support@calendarfuse.com"
          git add -A
          git commit -m "Restore CalendarFuse as direct static source"
          git push origin HEAD:main
