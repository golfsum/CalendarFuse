name: Materialize CalendarFuse source on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip materialize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source bundle
        shell: bash
        run: |
          test -d parts
          cat parts/source.part.* > /tmp/calendarfuse-source.tar.gz.b64
          base64 --decode /tmp/calendarfuse-source.tar.gz.b64 > /tmp/calendarfuse-source.tar.gz
          tar -xzf /tmp/calendarfuse-source.tar.gz -C .
          rm -rf parts
          rm -f .github/workflows/materialize.yml .github/workflows/materialize-on-push.yml

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "calendarfuse-builder"
          git config user.email "support@calendarfuse.com"
          git add -A
          git commit -m "Build CalendarFuse product site and interactive demo [skip materialize]"
          git push origin HEAD:main
