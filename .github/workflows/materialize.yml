name: Materialize CalendarFuse source

on:
  push:
    paths:
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source bundle
        shell: bash
        run: |
          cat parts/source.part.* > /tmp/calendarfuse-source.tar.gz.b64
          base64 --decode /tmp/calendarfuse-source.tar.gz.b64 > /tmp/calendarfuse-source.tar.gz
          tar -xzf /tmp/calendarfuse-source.tar.gz -C .
          rm -rf parts
          rm -f .github/workflows/materialize.yml

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "calendarfuse-builder"
          git config user.email "support@calendarfuse.com"
          git add -A
          git commit -m "Build CalendarFuse product site and interactive demo [skip ci]"
          git push origin HEAD:main
